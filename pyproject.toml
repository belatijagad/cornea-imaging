[project]
name = "cornea-imaging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "captum>=0.9,<1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
medsam = ["scipy>=1.18.1", "transformers>=5.23,<6"]

[dependency-groups]
dev = [
    "ruff>=0.17.6,<0.18",
    "ty>=0.0.107,<0.0.108",
    "vulture>=2.16,<3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ty.src]
include = ["cornea/config.py", "cornea/checkpoints.py"]

[tool.vulture]
paths = ["cornea", "scripts", "tests"]
min_confidence = 90
