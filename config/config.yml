model:
  backbones: [resnet18, resnet34, resnet50, swin_t, maxvit_t, swin_s]
  pretrained: true
  freeze_backbone: [false, true]

trainer:
  output_dir: outputs
  epochs: 50
  validation_interval: 5
  precision: bf16
  learning_rate: 0.0001
  weight_decay: 0.0001
  threshold: 0.5
  seed: 42
  folds: 5
  batch_size: 16
  num_workers: 0

data:
  data_root: data/cornea-slit
  preprocessed_images_csv: data/cornea-medsam/preprocessed_images.csv
  labels_csv: null
  labels: [fungal, bacterial, viral_other]
  folder_labels:
    Jamur: [1, 0, 0]
    Bakteri: [0, 1, 0]
    Mixed: [1, 1, 0]
    Others: [0, 0, 1]
  image_extensions: [.jpg, .jpeg, .png, .bmp, .tif, .tiff, .webp]

transforms:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment:
    horizontal_flip_probability: 0.5
    rotation_degrees: 10
